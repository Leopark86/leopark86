name: ✈ 항공권 가격 체크

on:
  schedule:
    - cron: "0 22-23 * * *"   # KST 07:00~08:00
    - cron: "0 0-14 * * *"    # KST 09:00~23:00

  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드: check(가격체크) / test(알림테스트) / debug(API진단)"
        required: false
        default: "check"

jobs:
  check-flight-prices:
    name: 항공권 가격 모니터링
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Secrets 설정 확인
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "⚠️  TELEGRAM_BOT_TOKEN secret이 없습니다!"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️  TELEGRAM_CHAT_ID secret이 없습니다!"
            exit 1
          fi
          echo "✅ Secrets 확인 완료"
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── API 진단 (mode=debug 일 때만) ────────────────────────────────
      - name: API 진단 (GitHub Actions IP에서 실제 응답 확인)
        if: github.event.inputs.mode == 'debug'
        run: python debug_api.py

      # ── 가격 체크 ────────────────────────────────────────────────────
      - name: 항공권 가격 체크
        if: github.event.inputs.mode != 'test' && github.event.inputs.mode != 'debug'
        run: python main.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 알림 테스트 ──────────────────────────────────────────────────
      - name: 테스트 알림 전송
        if: github.event.inputs.mode == 'test'
        run: python main.py --test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 로그 업로드 (항상) ───────────────────────────────────────────
      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-alert-log-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
