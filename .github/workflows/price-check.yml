name: ✈ 항공권 가격 체크

on:
  # 매시간 정각 실행 (KST 07:00~23:00 = UTC 22:00~14:00)
  schedule:
    - cron: "0 22-23 * * *"   # KST 07:00~08:00
    - cron: "0 0-14 * * *"    # KST 09:00~23:00

  # 수동 실행 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "테스트 알림만 전송 (true/false)"
        required: false
        default: "false"

jobs:
  check-flight-prices:
    name: 항공권 가격 모니터링
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # ── 1. 코드 체크아웃 ───────────────────────────────────────────────
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # ── 2. Python 설정 ────────────────────────────────────────────────
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. 패키지 설치 ────────────────────────────────────────────────
      - name: 패키지 설치
        run: pip install -r requirements.txt

      # ── 4. Playwright Chromium 설치 ───────────────────────────────────
      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      # ── 5. Secrets 설정 확인 ──────────────────────────────────────────
      - name: Secrets 설정 확인
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "⚠️  TELEGRAM_BOT_TOKEN secret이 설정되지 않았습니다!"
            echo "GitHub 레포 → Settings → Secrets and variables → Actions 에서 추가하세요."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️  TELEGRAM_CHAT_ID secret이 설정되지 않았습니다!"
            exit 1
          fi
          echo "✅ Telegram Secrets 확인 완료"
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 6. 가격 체크 실행 ─────────────────────────────────────────────
      - name: 항공권 가격 체크
        if: github.event.inputs.test_mode != 'true'
        run: python main.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 7. 테스트 알림 전송 (수동 실행 시 test_mode=true 인 경우) ──
      - name: 테스트 알림 전송
        if: github.event.inputs.test_mode == 'true'
        run: python main.py --test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── 8. 로그 업로드 (항상 실행 — 실패 원인 확인용) ───────────────
      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-alert-log-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
